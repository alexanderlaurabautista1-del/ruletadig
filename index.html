<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Circo del Design Thinking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="tent" aria-hidden="true"></div>
<header>
  <h1 class="glitch" data-text="EL CIRCO DEL DESIGN THINKING">EL CIRCO DEL DESIGN THINKING</h1>
  <p class="sub">Gira la ruleta y que el show comience</p>
</header>

<main>
  <section class="stage" aria-label="Ruleta">
    <div class="wheelbox">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="1040" height="1040" role="img" aria-label="Ruleta con cinco integrantes y dos sorpresas"></canvas>
    </div>
    <button id="spin" type="button">¡GIRAR!</button>
  </section>

  <section aria-label="Resultado">
    <div class="panel" aria-live="polite">
      <h2 class="who" id="who">¡Gira la ruleta!</h2>
      <img id="pic" class="pic" alt="" hidden>
    </div>


    <details>
      <summary>Configurar integrantes</summary>
      <div id="cfg"></div>
      <div class="opts">
        <label><input type="checkbox" id="norep" checked> No repetir integrantes</label>
        <label><input type="checkbox" id="mute"> Sin sonido</label>
        <button type="button" id="reset" class="small">Reiniciar show</button>
      </div>
    </details>
  </section>
</main>

<script src="config.js"></script>
<script src="ruleta.js"></script>
</body>
</html>
